<!doctype html>

  <body>
    <div id="map"></div>

    <!-- Top-left wordmark + live indicator -->

      <a class="brand" href="/" aria-label="Poliskollen">

      <button class="dl-btn" id="dl-open" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 3h2v8.2l2.6-2.6 1.4 1.4-5 5-5-5 1.4-1.4L11 11.2V3Zm-6 15h14v2H5v-2Z"/></svg>

            <span class="store-txt"><small>Ladda ner på</small><b>App Store</b></span>

          <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.jeramo.poliskollen" target="_blank" rel="noopener">

    <!-- Floating type filters -->
    <div class="filterbar" id="filters" aria-label="Filtrera händelsetyper"></div>

    <div class="attrib">Ej officiellt kopplad till Polismyndigheten · Polisens öppna data</div>

    <div class="map-loading" id="map-loading"><span class="spinner"></span> Laddar händelser…</div>

    <script type="module" src="/src/main.js"></script>

</html>
