<!doctype html>
<html lang="sv" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="description" content="Poliskollen — polishändelser i hela Sverige i realtid, direkt på kartan." />
    <title>Poliskollen — Polishändelser i realtid</title>
    <link rel="icon" type="image/png" href="/poliskollen-icon.png" />
    <link rel="apple-touch-icon" href="/poliskollen-icon.png" />
    <meta property="og:title" content="Poliskollen — Polishändelser i realtid" />
    <meta property="og:description" content="Följ polisens händelser i hela Sverige, live på kartan." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://poliskollen.nu/" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Top-left wordmark + live indicator -->
    <header class="topbar">
      <a class="brand" href="/" aria-label="Poliskollen">
        <img class="brand-mark" src="/poliskollen-icon.png" width="30" height="30" alt="" />
        <img class="brand-wordmark" src="/poliskollen-wordmark.png" alt="Poliskollen" />
      </a>
      <div class="live" title="Live från Polisens öppna data">
        <span class="live-dot"></span><b id="live-count">–</b> händelser
      </div>
    </header>

    <!-- Floating type filters -->
    <div class="filterbar" id="filters" aria-label="Filtrera händelsetyper"></div>

    <!-- Legend + disclaimer -->
    <div class="legend" id="legend"></div>
    <div class="attrib">Ej officiellt kopplad till Polismyndigheten · Polisens öppna data</div>

    <div class="map-loading" id="map-loading"><span class="spinner"></span> Laddar händelser…</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
