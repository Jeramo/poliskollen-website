<!doctype html>
<html lang="sv" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="robots" content="noindex" />
    <title>Sidan hittades inte — Poliskollen</title>
    <link rel="icon" type="image/png" href="/poliskollen-icon.png" />
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0b0d10; color: #e9edf4; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      main { max-width: 420px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      .code { margin: 24px 0 8px; color: #7db2ff; font-size: 14px; font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); }
      .message { margin: 14px 0 28px; color: #a0a9b8; line-height: 1.6; }
      a { display: inline-block; padding: 12px 20px; border-radius: 999px; background: #2f6bd6; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/poliskollen-icon.png" alt="" />
      <p class="code">404</p>
      <h1>Sidan hittades inte</h1>
      <p class="message">Adressen kan vara fel eller sidan kan ha flyttats.</p>
      <a href="/">Till kartan</a>
    </main>
  </body>
</html>
